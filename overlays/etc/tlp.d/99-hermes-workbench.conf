# Measured Ryzen 7 7730U midpoint for the target HP laptop.
# TLP is the sole power-policy owner. Full performance remains available with
# `sudo tlp performance`; a cooler manual profile remains `sudo tlp balanced`.
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_MIN_PERF_ON_AC=0
CPU_SCALING_MAX_FREQ_ON_AC=2900000
CPU_MIN_PERF_ON_BAT=0
CPU_SCALING_MAX_FREQ_ON_BAT=2900000
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave
WIFI_PWR_ON_AC=on
WIFI_PWR_ON_BAT=on
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y
USB_AUTOSUSPEND_ON_AC=1
USB_AUTOSUSPEND_ON_BAT=1
DISK_NVME_LPST_ON_AC=1
DISK_NVME_LPST_ON_BAT=1
SATA_LINKPWR_ON_AC=max_performance
SATA_LINKPWR_ON_BAT=min_power
WOL_DISABLE=Y
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power
